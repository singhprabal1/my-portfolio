<!doctype html>
<!--
  Source for public/og-image.png (1200x630 social preview).
  Regenerate:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=4000 --screenshot=public/og-image.png scripts/og-image.html
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Share+Tech+Mono&display=block" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #030704;
    background-image:
      linear-gradient(rgba(0,255,51,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,51,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    color: #ecffec;
    font-family: "Share Tech Mono", monospace;
    padding: 72px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 2px solid #2d5a2d;
  }
  .brand { font-size: 30px; letter-spacing: 0.15em; }
  .brand span { color: #00ff33; }
  .prompt { color: #00ff33; font-size: 30px; letter-spacing: 0.1em; margin-bottom: 18px; }
  h1 { font-size: 112px; font-weight: 400; line-height: 1; }
  .role { margin-top: 26px; font-size: 40px; color: #00ff33; }
  .role::after { content: ""; display: inline-block; width: 4px; height: 40px; background: #00ff33; margin-left: 8px; vertical-align: -4px; }
  .foot { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { border: 2px solid #2d5a2d; background: #061006; color: #9fb89f; padding: 10px 18px; font-size: 24px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="brand">PRABAL<span>.DEV</span></div>
  <div>
    <div class="prompt">&gt;_ hello, world</div>
    <h1>Prabal Singh</h1>
    <div class="role">&gt; Network &amp; cloud infrastructure</div>
  </div>
  <div class="foot">
    <span class="chip">San José State University</span>
    <span class="chip">Amazon NDE intern '26</span>
    <span class="chip">Cisco CCST</span>
  </div>
</body>
</html>
